<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trajectory browser</title>
<style>
  :root {
    --bg: #fff; --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb; --panel: #f6f8fa;
    --pass: #1baf7a; --fail: #eb6834; --err: #9ca3af;
    --user: #e8f1fd; --assistant: #fff; --tool: #f6f8fa; --accent: #2a78d6;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2a2f37; --panel: #171a20;
            --user: #16263d; --assistant: #12151b; --tool: #171a20; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  a { color: var(--accent); }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  select, input, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .muted { color: var(--muted); }
  .rates { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .rates div { padding: 6px 10px; background: var(--panel); border-radius: 6px; }
  .rates b { display: block; font-size: 16px; }
  table.matrix { border-collapse: separate; border-spacing: 2px; }
  table.matrix th { font-weight: 500; color: var(--muted); font-size: 12px; padding: 2px 4px; text-align: center; }
  table.matrix th.task { text-align: right; font-family: var(--mono); }
  table.matrix td { width: 44px; height: 24px; text-align: center; border-radius: 4px; cursor: pointer; color: #fff; font-size: 12px; }
  td.pass { background: var(--pass); } td.fail { background: var(--fail); } td.err { background: var(--err); }
  td.cell:hover { outline: 2px solid var(--fg); }
  .legend { margin: 8px 0 14px; display: flex; gap: 14px; align-items: center; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .p::before { background: var(--pass); } .legend .f::before { background: var(--fail); } .legend .e::before { background: var(--err); }

  /* trajectory view */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
  .tabs a { padding: 4px 10px; border-radius: 6px; color: #fff; text-decoration: none; font-size: 13px; }
  .tabs a.cur { outline: 3px solid var(--fg); }
  .kv { display: flex; gap: 16px; flex-wrap: wrap; margin: 6px 0 14px; color: var(--muted); }
  .kv b { color: var(--fg); font-weight: 600; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .box.error { border-color: var(--fail); }
  details > summary { cursor: pointer; font-weight: 600; }
  pre { font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 6px 0; padding: 8px; background: var(--panel); border-radius: 6px; max-height: 420px; overflow: auto; }
  .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .diff h4 { margin: 4px 0; font-size: 12px; color: var(--muted); }
  .msg { border-radius: 8px; padding: 8px 12px; margin: 8px 0; border: 1px solid var(--line); }
  .msg.user { background: var(--user); } .msg.assistant { background: var(--assistant); } .msg.tool { background: var(--tool); }
  .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .msg .text { white-space: pre-wrap; }
  .call { font-family: var(--mono); font-size: 12.5px; margin: 4px 0; padding: 4px 8px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 6px 6px 0; }
  .call b { color: var(--accent); }
  .turn { margin: 22px 0 6px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
  .turn.bad { color: var(--fail); }
  table.params { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 4px 0 10px; }
  table.params th, table.params td { text-align: left; vertical-align: top; padding: 3px 8px; border-bottom: 1px solid var(--line); }
  table.params code { font-family: var(--mono); font-size: 12px; }
  .tool-def { margin: 10px 0 14px; }
  .tool-def .name { font-family: var(--mono); font-weight: 600; }
  .orig { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<header>
  <h1>Trajectory browser</h1>
  <label>Benchmark <select id="bench"></select></label>
  <label>Model <select id="model"></select></label>
  <label>Show <select id="filter">
    <option value="all">all tasks</option>
    <option value="diverge">tasks whose verdict differs across conditions</option>
    <option value="d0pass">tasks that pass under D0</option>
    <option value="d0fail">tasks that fail under D0</option>
  </select></label>
  <label>Task <input id="search" placeholder="e.g. 78" size="6"></label>
  <span id="status" class="muted"></span>
</header>
<main id="main"></main>

<script>
// Reads runs/main/index.json (one row per trajectory, every benchmark) and the trajectory files it
// points to. Nothing is precomputed here: the matrix, the verdict and the transcript come from the
// files as written by the runners.
const RUN = "../runs/main/";
const BENCH_NAMES = { bfcl: "BFCL multi-turn", toolsandbox: "ToolSandbox", tau2: "τ²-bench airline" };
let INDEX, CONDS = [], BY = {};   // BY[benchmark][model][cond][taskId] -> index row
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = id => parseInt(id.split("_").pop(), 10);
const short = m => m.split("/").pop();
const pretty = v => { if (typeof v === "string") { try { v = JSON.parse(v); } catch {} } return typeof v === "string" ? v : JSON.stringify(v, null, 2); };
const fmt = n => Number(n || 0).toLocaleString();

async function init() {
  INDEX = await (await fetch(RUN + "index.json")).json();
  // tau2 tasks may have several trials: trial 1 keeps the task id, later trials are keyed "<id> t<n>".
  for (const r of INDEX.trajectories) ((((BY[r.benchmark] ??= {})[r.model] ??= {})[r.condition] ??= {})[r.trial > 1 ? `${r.id} t${r.trial}` : r.id] = r);
  CONDS = [...new Set(INDEX.trajectories.map(r => r.condition))].sort();
  $("#bench").innerHTML = Object.keys(BY).sort().map(b => `<option value="${b}">${esc(BENCH_NAMES[b] || b)}</option>`).join("");
  fillModels();
  $("#bench").onchange = () => { location.hash = ""; fillModels(); render(); };
  for (const el of ["#model", "#filter"]) $(el).onchange = () => { location.hash = ""; render(); };
  $("#search").oninput = render;
  window.onhashchange = render;
  render();
}

const bench = () => $("#bench").value;
const isTS = () => bench() === "toolsandbox";
const table = () => BY[bench()];
// Verdict per benchmark: BFCL's evaluator, ToolSandbox's similarity (1.0 = every milestone met), tau2's reward.
const ok = r => isTS() ? r.similarity === 1 : bench() === "tau2" ? r.pass : r.valid;
const cls = r => r.inference_error ? "err" : ok(r) ? "pass" : "fail";
const glyph = r => r.inference_error ? "!" : ok(r) ? "✓" : "✗";
const link = (m, c, id) => encodeURIComponent(JSON.stringify([m, c, id, bench()]));

function fillModels() {
  const models = Object.keys(table()).sort();
  $("#model").innerHTML = models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
}

function render() {
  const h = location.hash.slice(1);
  if (h) { const [m, c, t, b] = JSON.parse(decodeURIComponent(h)); $("#bench").value = b || "bfcl"; fillModels(); $("#model").value = m; return showTrajectory(m, c, t); }
  showMatrix($("#model").value);
}

function rateCell(c, s) {
  if (isTS()) return `<div><span class="muted">${c}</span><b>${(100 * s.mean_similarity).toFixed(1)}</b><span class="muted">mean similarity · ${s.passed}/${s.scenarios} at 1.0</span></div>`;
  const n = s.tasks ?? s.evaluated;
  return `<div><span class="muted">${c}</span><b>${(100 * s.success_rate).toFixed(1)}%</b><span class="muted">${s.passed}/${n}</span></div>`;
}

function cellTitle(r) {
  if (isTS()) return `similarity ${r.similarity.toFixed(2)}${r.error_type ? " · " + r.error_type : ""}`;
  if (bench() === "tau2") return `${r.pass ? "pass" : "fail"} · ${String(r.termination_reason).split(".").pop().toLowerCase()} · ${r.num_tool_calls} calls`;
  return `${esc(r.error_type || "pass")} · ${r.num_tool_calls} calls`;
}

function showMatrix(model) {
  const BY = table();
  const conds = CONDS.filter(c => BY[model][c]);
  const ids = Object.keys(BY[model][conds[0]]).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const filter = $("#filter").value, q = $("#search").value.trim();
  const rows = ids.filter(id => {
    if (q && (bench() === "bfcl" ? num(id) !== parseInt(q, 10) : !id.startsWith(q))) return false;
    const v = conds.map(c => { const r = BY[model][c][id]; return r && ok(r); });
    if (filter === "diverge") return new Set(v).size > 1;
    if (filter === "d0pass") return v[0] === true;
    if (filter === "d0fail") return v[0] === false;
    return true;
  });
  const rates = conds.map(c => rateCell(c, INDEX.summary[bench()][`${model} ${c}`])).join("");
  const head = `<tr><th></th>${conds.map(c => `<th>${c}</th>`).join("")}</tr>`;
  const body = rows.map(id => `<tr><th class="task">${bench() === "bfcl" ? num(id) : esc(id)}</th>${conds.map(c => {
    const r = BY[model][c][id];
    if (!r) return `<td></td>`;
    return `<td class="cell ${cls(r)}" title="${cellTitle(r)}" onclick="location.hash='${link(model, c, id)}'">${isTS() ? r.similarity.toFixed(2) : glyph(r)}</td>`;
  }).join("")}</tr>`).join("");
  $("#status").textContent = `${rows.length} of ${ids.length} tasks`;
  $("#main").innerHTML = `<div class="rates">${rates}</div>
    <div class="legend"><span class="p">pass</span><span class="f">fail</span><span class="e">inference error</span><span class="muted">Click a cell to open the trajectory.</span></div>
    <table class="matrix">${head}${body}</table>`;
}

// The runners record API calls in two shapes: BFCL and ToolSandbox keep the raw HTTP exchange
// ({request: {body}, response: {status_code, body}}), tau2 the client call ({request, response}).
const reqOf = c => c.request?.body ?? c.request ?? {};
const resOf = c => c.response?.body ?? c.response ?? {};

function headerFacts(d, row) {
  const t = d.totals, provider = (d.api_calls || []).map(c => resOf(c).provider).find(Boolean) || "–";
  const tokens = `${fmt(t.prompt_tokens)} in / ${fmt(t.completion_tokens)} out`;
  if (isTS()) return [["similarity", d.result.similarity.toFixed(3)], ["milestones", d.result.milestone_similarity.toFixed(3)], ["minefields", d.result.minefield_similarity.toFixed(3)],
    ["messages", d.result.turn_count], ["agent calls", row.api_calls], ["user-simulator calls", d.user_totals.api_calls], ["tokens", tokens], ["reasoning tokens", t.reasoning_tokens],
    ["cost", `$${t.cost_usd.toFixed(4)} + $${d.user_totals.cost_usd.toFixed(4)} user`], ["provider", provider],
    ["categories", d.categories.filter(c => !/DISTRACTION|ALL_TOOLS/.test(c)).join(", ").toLowerCase()]];
  if (bench() === "tau2") { const rb = d.result.reward_info?.reward_breakdown || {};
    return [["reward", d.result.reward], ["ended by", String(d.result.termination_reason).split(".").pop().toLowerCase()],
      ["DB check", rb.DB ?? "–"], ["communicate check", rb.COMMUNICATE ?? "–"], ["messages", row.num_messages], ["tool calls", row.num_tool_calls],
      ["agent calls", row.api_calls], ["user-simulator calls", d.user_totals.api_calls], ["tokens", tokens], ["reasoning tokens", t.reasoning_tokens],
      ["cost", `$${t.cost_usd.toFixed(4)} + $${d.user_totals.cost_usd.toFixed(4)} user + $${(d.judge_totals?.cost_usd || 0).toFixed(4)} judge`], ["provider", provider]]; }
  return [["verdict", row.valid ? "pass" : row.error_type || "fail"], ["turns", row.num_turns], ["API calls", row.api_calls],
    ["tool calls", `${row.num_tool_calls} (${row.num_failed_tool_calls} failed)`], ["tokens", tokens], ["reasoning tokens", t.reasoning_tokens],
    ["cost", `$${t.cost_usd.toFixed(4)}`], ["wall time", `${row.wall_time_s.toFixed(0)} s`], ["provider", provider], ["classes", d.task.involved_classes.join(", ")]];
}

function extras(d) {
  const box = (title, v) => `<details class="box"><summary>${title}</summary><pre>${esc(typeof v === "string" ? v : JSON.stringify(v, null, 2))}</pre></details>`;
  if (isTS()) return box("ToolSandbox conversation (milestone matches, database updates)", d.toolsandbox?.conversation ?? "not written: the play aborted with an exception (see the error above), which ToolSandbox scores as similarity 0")
    + box("ToolSandbox pretty-printed transcript", d.toolsandbox?.pretty_print || "");
  if (bench() === "tau2") return box("Reward details", d.result.reward_info) + box("tau2 simulation record", d.tau2);
  return box("Task definition", d.task) + box("BFCL result (decoded calls per step)", d.bfcl_result);
}

async function showTrajectory(model, cond, id) {
  const BY = table();
  const row = BY[model][cond][id];
  $("#status").textContent = "loading…";
  const d = await (await fetch(RUN + row.file)).json();
  $("#status").textContent = "";
  const tabs = CONDS.filter(c => BY[model][c]?.[id]).map(c => { const r = BY[model][c][id];
    return `<a class="${cls(r)}${c === cond ? " cur" : ""}" href="#${link(model, c, id)}">${c} ${isTS() ? r.similarity.toFixed(2) : glyph(r)}</a>`; }).join("");
  const kv = headerFacts(d, row).map(([k, v]) => `<span>${k} <b>${esc(v)}</b></span>`).join("");
  const verdict = isTS() ? renderTS(d) : bench() === "tau2" ? renderTau2(d) : renderEval(d.evaluation);
  const transcript = bench() === "tau2" ? renderMessages(d.tau2?.messages || []) : renderTranscript(d);
  $("#main").innerHTML = `<p><a href="#" onclick="location.hash='';return false">← back to ${esc(short(model))}</a></p>
    <h2 style="margin:4px 0">${esc(id)} · ${esc(short(model))} · ${cond}</h2>
    <div class="tabs">${tabs}</div>
    <div class="kv">${kv}</div>
    ${d.error ? `<div class="box error"><b>${isTS() ? "Scenario error" : "Inference error"}.</b> ${esc(d.error.message)}</div>` : ""}
    ${verdict}
    <h3>Transcript</h3>${transcript}
    <details class="box"><summary>Tools sent to the model (${(d.tools_sent || []).length})</summary>${renderTools(d)}</details>
    ${extras(d)}`;
  window.scrollTo(0, 0);
}

function renderTS(d) {
  const r = d.result, ms = Object.entries(r.milestone_mapping || {});
  const rows = ms.map(([i, [idx, sim]]) => `<tr><td>milestone ${i}</td><td>message ${idx}</td><td>${Number(sim).toFixed(3)}</td></tr>`).join("");
  return `<div class="box${r.similarity === 1 ? "" : " error"}"><b>${r.similarity === 1 ? "Pass" : "Partial"} · similarity ${r.similarity.toFixed(3)}</b>
    <div class="muted">Mean of the matched milestone similarities (each a geometric mean over its constraints), zeroed if a minefield is hit; 1.0 means every milestone was met exactly.</div>
    ${rows ? `<table class="params"><tr><th>milestone</th><th>matched at</th><th>similarity</th></tr>${rows}</table>` : ""}</div>`;
}

function renderTau2(d) {
  const r = d.result, info = r.reward_info || {}, pass = r.reward === 1;
  const checks = (info.communicate_checks || []).map(c => `<tr><td>${esc(c.info ?? JSON.stringify(c))}</td><td>${c.met ? "met" : "not met"}</td><td class="muted">${esc(c.justification || "")}</td></tr>`).join("");
  return `<div class="box${pass ? "" : " error"}"><b>${pass ? "Pass" : "Fail"} · reward ${r.reward}</b>
    <div class="muted">Reward is 1 only if the final database matches the one the ground-truth actions produce${info.reward_basis?.includes("COMMUNICATE") ? " and every required piece of information was communicated to the user" : ""}.</div>
    <div>database ${info.db_check?.db_match ? "matches" : "differs"}${checks ? "" : " · no communicate checks on this task"}</div>
    ${checks ? `<table class="params"><tr><th>information to communicate</th><th></th><th>judge</th></tr>${checks}</table>` : ""}</div>`;
}

function renderEval(ev) {
  if (ev.valid) return `<div class="box"><b>Pass.</b> Final state and execution responses match the ground truth in every turn.</div>`;
  const e = ev.error || {}; let body = "";
  const diffs = e.details?.differences;
  if (diffs) body += Object.entries(diffs).map(([k, v]) => `<div class="diff"><div><h4>${esc(k)} · model</h4><pre>${esc(pretty(v.model))}</pre></div><div><h4>${esc(k)} · ground truth</h4><pre>${esc(pretty(v.ground_truth))}</pre></div></div>`).join("");
  if (e.details?.missing_items) body += `<h4 class="muted">Ground-truth execution responses the model never produced</h4><pre>${esc(e.details.missing_items.join("\n"))}</pre>`;
  const rest = Object.fromEntries(Object.entries(e.details || {}).filter(([k]) => !["differences", "missing_items"].includes(k)));
  if (Object.keys(rest).length) body += `<details><summary class="muted">Other checker details</summary><pre>${esc(JSON.stringify(rest, null, 2))}</pre></details>`;
  return `<div class="box error"><b>Fail · ${esc(e.error_type || "")}</b><div>${esc([].concat(e.error_message || []).join(" "))}</div>${body}</div>`;
}

// Walk the API calls in order. Each request carries the full history, so the messages added
// since the previous request plus the response form a linear transcript.
function renderTranscript(d) {
  let prev = 0, out = "", turn = 0;
  (d.api_calls || []).forEach((c, i) => {
    const req = reqOf(c), res = resOf(c), msgs = req.messages || [];
    const fresh = msgs.length >= prev ? msgs.slice(prev) : msgs;
    if (msgs.length < prev) out += `<div class="turn bad">History shrank before call ${i + 1}; showing the full request.</div>`;
    for (const m of fresh) { if (m.role === "user") out += `<div class="turn">Turn ${++turn}</div>`; out += renderMsg(m); }
    const choice = res.choices?.[0];
    const meta = `call ${i + 1}/${d.api_calls.length} · ${c.latency_s?.toFixed(1)} s · ${res.usage?.prompt_tokens ?? "?"} in / ${res.usage?.completion_tokens ?? "?"} out${choice ? " · " + choice.finish_reason : ""}`;
    if (choice) { out += renderMsg(choice.message, meta); prev = msgs.length + 1; }
    else { out += `<div class="msg tool"><div class="role">response${c.response?.status_code ? " · HTTP " + c.response.status_code : ""}</div><pre>${esc(JSON.stringify(res, null, 2))}</pre></div>`; prev = msgs.length; }
  });
  return out || `<p class="muted">No API calls were recorded.</p>`;
}

// tau2 keeps its own message log (agent, user, tool results), which is the transcript the evaluator saw.
function renderMessages(msgs) {
  let out = "", turn = 0;
  for (const m of msgs) { if (m.role === "user") out += `<div class="turn">Turn ${++turn}</div>`; out += renderMsg(m); }
  return out || `<p class="muted">No messages were recorded.</p>`;
}

function renderMsg(m, meta) {
  let body = "";
  if (m.reasoning) body += `<details><summary class="muted">reasoning</summary><div class="text">${esc(m.reasoning)}</div></details>`;
  if (m.content) body += m.role === "tool" ? renderLong(pretty(m.content)) : `<div class="text">${esc(m.content)}</div>`;
  for (const tc of m.tool_calls || []) {  // OpenAI shape {function: {name, arguments}} or tau2's {name, arguments}
    const name = tc.function?.name ?? tc.name, a = pretty(tc.function?.arguments ?? tc.arguments);
    body += `<div class="call"><b>${esc(name)}</b>(${a.length > 90 ? `<pre>${esc(a)}</pre>` : esc(a.replace(/\s*\n\s*/g, " "))})</div>`;
  }
  return `<div class="msg ${m.role}"><div class="role">${m.role}${meta ? " · " + esc(meta) : ""}</div>${body || '<span class="muted">(empty)</span>'}</div>`;
}

function renderLong(s) {
  return s.length > 600 ? `<details><summary class="muted">${esc(s.slice(0, 200))}… (${s.length} chars)</summary><pre>${esc(s)}</pre></details>` : `<pre>${esc(s)}</pre>`;
}

// The schemas exactly as sent, with the original name beside each generic one (from the name maps).
function renderTools(d) {
  const tmap = d.name_maps?.tool || {}, pmap = d.name_maps?.param || {};
  return (d.tools_sent || []).map(t => {
    const f = t.function || t, props = f.parameters?.properties || {}, req = new Set(f.parameters?.required || []);
    const rows = Object.entries(props).map(([p, s]) => {
      const orig = pmap[f.name]?.[p]?.name; const extra = ["enum", "pattern", "items", "default"].filter(k => k in s).map(k => `${k}: ${esc(JSON.stringify(s[k]))}`).join("<br>");
      return `<tr><td><code>${esc(p)}</code>${orig && orig !== p ? ` <span class="orig">(${esc(orig)})</span>` : ""}${req.has(p) ? "" : ' <span class="muted">optional</span>'}</td><td><code>${esc(s.type || "")}</code></td><td>${esc(s.description || "") || '<span class="muted">—</span>'}${extra ? `<div class="muted">${extra}</div>` : ""}</td></tr>`;
    }).join("");
    return `<div class="tool-def"><div class="name">${esc(f.name)}${tmap[f.name] ? ` <span class="orig">(${esc(tmap[f.name])})</span>` : ""}</div>
      <div>${esc(f.description || "") || '<span class="muted">(no description)</span>'}</div>
      ${rows ? `<table class="params"><tr><th>parameter</th><th>type</th><th>description</th></tr>${rows}</table>` : ""}</div>`;
  }).join("");
}

init().catch(e => { $("#main").innerHTML = `<p class="box error">Could not load ${RUN}index.json: ${esc(e)}. Start the browser with <code>./run.sh browse</code> from the repository root.</p>`; });
</script>
</body>
</html>
